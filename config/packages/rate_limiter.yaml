framework:
    rate_limiter:
        # Par adresse IP
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        verification_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        forgot_password:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Par joueur : créer, rejoindre, quitter un salon
        game_actions:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
        # Par joueur : enregistrer son avatar
        avatar_update:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
        # Par joueur : coups pendant une partie de belote (enchères, cartes)
        belote_actions:
            policy: sliding_window
            limit: 90
            interval: '1 minute'
