# Services Docker de Playora.
# Les mots de passe ne sont jamais écrits ici : ils sont lus dans .env.docker.local (non commité).

services:
###> doctrine/doctrine-bundle ###
  database:
    image: mysql:8.4
    env_file:
      - path: .env.docker.local
        required: true
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      # Les données sont gardées entre deux redémarrages
      - mysql_data:/var/lib/mysql
      # Scripts lancés une seule fois, à la création de la base (droits sur la base de test)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  mysql_data:
###< doctrine/doctrine-bundle ###
